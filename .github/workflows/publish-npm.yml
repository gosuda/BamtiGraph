name: Publish npm and JSR release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: depot-ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11 --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Validate release and check for an existing version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { VERSION } from './src/index.ts';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'bamtigraph');
          assert.match(pkg.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package.json');
          assert.equal(VERSION, pkg.version, 'Runtime version must match package.json');
          const response = await fetch(`https://registry.npmjs.org/bamtigraph/${pkg.version}`, { signal: AbortSignal.timeout(30000) });
          if (response.ok) {
            const existing = await response.json();
            assert.equal(existing.name, pkg.name);
            assert.equal(existing.version, pkg.version);
            console.log(`${pkg.name}@${pkg.version} is already published; skipping this immutable version.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          } else if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else {
            throw new Error(`npm version lookup failed: HTTP ${response.status}`);
          }
          NODE
      - name: Publish to npm using GitHub OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts

  publish-jsr:
    needs: verify
    runs-on: depot-ubuntu-24.04
    environment: jsr
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate release tag and package identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          deno eval --config jsr.json '
            import { VERSION } from "./src/index.ts";
            const config = JSON.parse(await Deno.readTextFile("jsr.json"));
            const stableVersion = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (config.name !== "@safe/bamtigraph" ||
                !stableVersion.test(config.version) ||
                Deno.env.get("RELEASE_TAG") !== `v${config.version}` ||
                VERSION !== config.version) {
              throw new Error("JSR release requires @safe/bamtigraph, a stable version, and matching release tag, jsr.json version, and source VERSION.");
            }
            console.log(`Validated ${config.name}@${config.version}`);
          '
      - name: Verify JSR package before publication
        run: deno publish --config jsr.json --dry-run
      - name: Publish to JSR using GitHub OIDC
        run: deno publish --config jsr.json

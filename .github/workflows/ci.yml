name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'compatibility' || 'routine' }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        node: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('[20,22,24]') || fromJSON('[24]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npm pack --dry-run --ignore-scripts
      - run: deno publish --config jsr.json --dry-run
  go:
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        go: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["1.22.x","stable"]') || fromJSON('["stable"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./examples/quickstart -o /tmp/quickstart.png
      - run: go build -trimpath -o /tmp/bamtigraph ./cmd/bamtigraph

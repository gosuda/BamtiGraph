name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npm pack --dry-run --ignore-scripts
      - run: deno publish --config jsr.json --dry-run
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./examples/quickstart -o /tmp/quickstart.png
      - run: go build -trimpath -o /tmp/bamtigraph ./cmd/bamtigraph
